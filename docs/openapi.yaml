openapi: 3.0.3
info:
  title: NoteFlow API
  version: 1.0.0
  description: |
    REST API for personal notes and team notes.
    Ownership comes from the server session, never from `userId` in the body.
    JWT is not used. Send `Authorization: Bearer <token>`.
  license:
    name: ISC
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
  - name: Personal notes
  - name: Teams
  - name: Team members
  - name: Team notes
paths:
  /api/health:
    get:
      tags: [Health]
      security: []
      summary: Process liveness
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Create an account and a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        "200":
          description: Signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Session deleted
        "401":
          $ref: "#/components/responses/AuthRequired"
  /api/v1/notes:
    post:
      tags: [Personal notes]
      summary: Create a personal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created with teamId null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
    get:
      tags: [Personal notes]
      summary: List personal notes
      responses:
        "200":
          description: Notes where teamId is null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
  /api/v1/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Personal notes]
      summary: Read one personal note
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NoteNotFound"
    patch:
      tags: [Personal notes]
      summary: Update a personal note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NoteNotFound"
    delete:
      tags: [Personal notes]
      summary: Delete a personal note
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/NoteNotFound"
  /api/v1/teams:
    post:
      tags: [Teams]
      summary: Create a team; caller becomes OWNER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
    get:
      tags: [Teams]
      summary: List teams of the signed-in user
      responses:
        "200":
          description: Teams with the caller's role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
  /api/v1/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Teams]
      summary: Read one team
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/TeamNotFound"
    patch:
      tags: [Teams]
      summary: Rename a team (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Only the team owner can rename the team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/TeamNotFound"
    delete:
      tags: [Teams]
      summary: Delete a team (OWNER)
      responses:
        "204":
          description: Team, members, and team notes removed
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Only the team owner can delete the team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/TeamNotFound"
  /api/v1/teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Team members]
      summary: List members
      responses:
        "200":
          description: Members including OWNER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListedMemberListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/TeamNotFound"
    post:
      tags: [Team members]
      summary: Add a member (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Only the team owner can add members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found or User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User is already a team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Team members]
      summary: Change role ADMIN or MEMBER (OWNER)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddedMemberResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Only the team owner can change member roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found or User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Team members]
      summary: Remove a member (OWNER)
      responses:
        "204":
          description: Membership deleted
        "400":
          description: The team owner cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "403":
          description: Only the team owner can remove members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Team not found or User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/teams/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Team notes]
      summary: Create a team note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: Note created; teamId from the URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/TeamNotFound"
    get:
      tags: [Team notes]
      summary: List team notes
      responses:
        "200":
          description: Notes for this team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          $ref: "#/components/responses/TeamNotFound"
  /api/v1/teams/{id}/notes/{noteId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/NoteId"
    patch:
      tags: [Team notes]
      summary: Update a team note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNoteRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: Team not found or Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Team notes]
      summary: Delete a team note
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: Team not found or Note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 43-character session token from register or login. Not a JWT.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    AuthRequired:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyAttempts:
      description: Too many attempts. Try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoteNotFound:
      description: Note not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TeamNotFound:
      description: Team not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
    User:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
    Note:
      type: object
      required: [id, title, content, createdBy, teamId, isPinned, isArchived, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        createdBy:
          type: integer
        teamId:
          type: integer
          nullable: true
        isPinned:
          type: boolean
        isArchived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Team:
      type: object
      required: [id, name, createdBy, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        createdBy:
          type: integer
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        createdAt:
          type: string
          format: date-time
    ListedMember:
      type: object
      required: [teamId, userId, name, email, role, joinedAt]
      properties:
        teamId:
          type: integer
        userId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time
    AddedMember:
      type: object
      required: [teamId, userId, name, email, role, joinedAt]
      properties:
        teamId:
          type: integer
        userId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
        joinedAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CreateNoteRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 20000
    UpdateNoteRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        isPinned:
          type: boolean
        isArchived:
          type: boolean
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 150
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [ADMIN, MEMBER]
    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [ADMIN, MEMBER]
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
    SessionResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Session"
    MeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/User"
    NoteResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Note"
    NoteListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Note"
    TeamResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Team"
    TeamListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Team"
    ListedMemberListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/ListedMember"
    AddedMemberResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AddedMember"
